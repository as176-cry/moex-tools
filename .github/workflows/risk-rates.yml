name: Ставки риска НКЦ

on:
  schedule:
    - cron: "37 16 * * 1-5"   # 19:37 МСК по будням, после расчёта НКЦ в 19:00
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_rates.py"
      - ".github/workflows/risk-rates.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Скачать ставки
        run: python scripts/fetch_rates.py
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновить ставки риска НКЦ"
          git pull --rebase origin main
          git push
